services:
  db:
    image: pgvector/pgvector:pg16
    container_name: civicpulse_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civicpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicpulse_db"]
      interval: 3s
      timeout: 5s
      retries: 5



  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicpulse_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/civicpulse_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONPATH=/app
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - POLICYMAKER_EMAILS=${POLICYMAKER_EMAILS:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    container_name: civicpulse_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - POLICYMAKER_EMAILS=${POLICYMAKER_EMAILS:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    depends_on:
      - backend

volumes:
  postgres-data:
